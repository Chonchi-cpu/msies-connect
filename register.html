<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account - MSIES Connect</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<main class="container">
  <div class="auth-box">
    <h2>Create your account</h2>
    <p class="muted">Join MSIES Connect to stay updated</p>

    <form id="register-form">
      <p>
        I am a:
        <label><input type="radio" name="role" value="student"> Student</label>
        <label><input type="radio" name="role" value="parent" checked> Parent</label>
      </p>
      <p>Full name:<br><input type="text" id="name" placeholder="Juan Dela Cruz" required></p>
      <p>Email address:<br><input type="email" id="email" placeholder="juan.delacruz@email.com" required></p>
      <p>Password:<br><input type="password" id="password" placeholder="Create a password" required></p>
      <p>Confirm password:<br><input type="password" id="confirm" placeholder="Re-enter password" required></p>
      <p>Child's grade &amp; section (for parents):<br><input type="text" id="section" placeholder="e.g. Grade 3 - Mabini"></p>
      <button type="submit" class="btn">Create account</button>
    </form>

    <p>Already have an account? <a href="login-choice.html">Log in</a></p>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/components/navbar.js"></script>
<script>
  renderNavbar('home');

  document.getElementById('register-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (password !== confirm) {
      alert('Passwords do not match.');
      return;
    }
    const role = document.querySelector('input[name="role"]:checked').value;
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;

    const users = getUsers();
    users.push({ name, email, password, role });
    saveUsers(users);

    alert(`Welcome to MSIES Connect, ${name}. You can now log in.`);
    window.location.href = 'login-choice.html';
  });
</script>

</body>
</html>
