<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account - MSIES Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<main class="container">
  <div class="auth-box" id="register-box">
    <div class="auth-icon-wrap"><span class="logo-badge lg">M</span></div>
    <h2 style="text-align:center">Create your account</h2>
    <p class="muted" style="text-align:center">Join MSIES Connect to stay updated</p>

    <form id="register-form">
      <p>
        I am a:
        <label><input type="radio" name="role" value="student"> Student</label>
        <label><input type="radio" name="role" value="parent" checked> Parent</label>
      </p>
      <p>Full name:<br><input type="text" id="name" placeholder="Juan Dela Cruz" required></p>
      <p>Email address:<br><input type="email" id="email" placeholder="juan.delacruz@email.com" required></p>
      <p>Password:<br><input type="password" id="password" placeholder="Create a password" required></p>
      <p>Confirm password:<br><input type="password" id="confirm" placeholder="Re-enter password" required></p>
      <p>Child's grade &amp; section (for parents):<br><input type="text" id="section" placeholder="e.g. Grade 3 - Mabini"></p>
      <button type="submit" class="btn">Create account</button>
    </form>

    <p>Already have an account? <a href="login-choice.html">Log in</a></p>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/components/navbar.js"></script>
<script>
  renderNavbar('home');

  document.getElementById('register-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (password !== confirm) {
      alert('Passwords do not match.');
      return;
    }
    const role = document.querySelector('input[name="role"]:checked').value;
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;
    const section = document.getElementById('section').value.trim();

    const users = getUsers();
    users.push({ name, email, password, role, section: section || undefined });
    saveUsers(users);

    document.getElementById('register-box').innerHTML = `
      <div class="icon-circle success">&#10003;</div>
      <h2 style="text-align:center">Account created!</h2>
      <p class="muted" style="text-align:center">Welcome to MSIES Connect, ${name}. You can now log in to see announcements, events, and messages from the school.</p>
      <p style="text-align:center"><a href="login-choice.html" class="btn">Go to log in</a></p>
    `;
  });
</script>

</body>
</html>
