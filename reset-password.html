<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password - MSIES Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-placeholder"></div>

<main class="container">
  <a href="login-choice.html" class="back-link">&larr; Back to log in</a>
  <div class="auth-box" id="reset-box">
    <div class="auth-icon-wrap"><span class="logo-badge lg">M</span></div>
    <h2 style="text-align:center">Reset your password</h2>
    <p class="muted" style="text-align:center">We'll send a reset link to your registered email</p>

    <form id="reset-form">
      <p>Email address:<br><input type="email" id="email" placeholder="juan.delacruz@email.com" required></p>
      <button type="submit" class="btn">Send reset link</button>
    </form>

    <p>Remembered your password? <a href="login-choice.html">Log in</a></p>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/components/navbar.js"></script>
<script>
  renderNavbar('home');

  document.getElementById('reset-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    document.getElementById('reset-box').innerHTML = `
      <div class="icon-circle info">&#9993;</div>
      <h2 style="text-align:center">Reset link sent</h2>
      <p class="muted" style="text-align:center">We've sent a password reset link to <strong>${email}</strong>. Check your inbox and follow the instructions to set a new password.</p>
      <p style="text-align:center"><a href="login-choice.html" class="btn">Back to log in</a></p>
    `;
  });
</script>

</body>
</html>
