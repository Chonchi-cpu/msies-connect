<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed - MSIES Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-placeholder"></div>
<div id="modal-root"></div>

<main class="container">
  <div class="page-header-row">
    <h2>Feed</h2>
    <div id="new-post-wrap"></div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="feed-layout">
    <div class="feed-main">
      <div id="posts"></div>
    </div>
    <aside class="feed-sidebar">
      <h3 style="margin-top:0;">Upcoming events</h3>
      <ul class="upcoming-list" id="upcoming-events"></ul>
    </aside>
  </div>
</main>

<script src="js/data.js"></script>
<script src="js/components/navbar.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/postForm.js"></script>
<script src="js/components/announcementCard.js"></script>
<script src="js/pages/feed.js"></script>

</body>
</html>
